# TEMPORARY — branch-only test of Sonnet 5 curation + YouTube feed reliability.
# Publishes nothing. Removed before merge.
name: Temp test (Sonnet 5 + YouTube probe)

on:
  push:
    branches: [claude/vibrant-johnson-95c817]
    paths: [.github/workflows/tmp-test.yml]

jobs:
  youtube-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hit all 8 channel feeds, 4 rounds, 90s apart
        run: |
          ids="UCR2_8uHyWcTSV6iIw6BN4rg UCMb0O2CdPBNi-QqPk5T3gsQ UC3KqjxjVuqxXpjvLxFzyd9g UCtz9CYhNfDnuQ80QHZMS_sQ UCwT72F8AWH-nbQYs-1GUBZQ UCu7x43fFlwbBykF1r04T_wQ UCJwRmBtnYh_7Xs9oXUrLhZg UCiolFxnJSOPMmV1mh9EYyIQ"
          for round in 1 2 3 4; do
            line="round $round:"; ok=0
            for id in $ids; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.youtube.com/feeds/videos.xml?channel_id=$id")
              line="$line $code"; [ "$code" = 200 ] && ok=$((ok+1))
              sleep 2
            done
            echo "$line  => $ok/8 OK"
            [ $round -lt 4 ] && sleep 90
          done
          echo "--- control: channel pages (not the feed) ---"
          for id in UCR2_8uHyWcTSV6iIw6BN4rg UCMb0O2CdPBNi-QqPk5T3gsQ; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' "https://www.youtube.com/channel/$id/videos") channel page $id"
          done

  sonnet5-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the scout (preview only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OUTPUT_PATH: preview/radar.preview.json
          COLLECTED_PATH: preview/collected.json
        run: mkdir -p preview && node scout.mjs
      - name: Show radar
        if: always()
        run: |
          jq -r '.[] | "[\(.kind)] \(.source) | \(.title)\n    TEXT: \(.body[0:300])"' preview/collected.json | grep -A1 -F -f <(jq -r '.trends[].source_url' preview/radar.preview.json 2>/dev/null | sed 's/.*/&/') || true
          echo "===== RADAR PREVIEW ====="
          cat preview/radar.preview.json || true
