# Manual "dry run": runs the full scout but NEVER publishes — no commit, no
# radar.json change, no Gist update. Use it to preview a radar or to check a
# change (e.g. new Reddit API secrets) before the Wednesday run.
# Actions tab → "Radar dry run" → Run workflow. Results: the run's log and
# the "dry-run-results" download at the bottom of the run page.
name: Radar dry run

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run the scout (preview only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OUTPUT_PATH: preview/radar.preview.json
          COLLECTED_PATH: preview/collected.json
          IMAGES_DIR: preview/images
        run: mkdir -p preview && node scout.mjs

      - name: Show what was collected and picked
        if: always()
        run: |
          echo "===== COLLECTED ====="
          jq -r '.[] | "[\(.kind)] \(.source) | \(.created) | \(if .score then "▲\(.score) 💬\(.comments) | " else "" end)\(.title)\n    \(.url)"' preview/collected.json || true
          echo "===== RADAR PREVIEW (each pick next to the source text it was written from) ====="
          jq -r --slurpfile c preview/collected.json '.trends[] as $t
            | ($c[0][] | select(.url == $t.source_url)) as $i
            | "\n### \($t.name)   [src: \($t.src) · tpl: \($t.tpl)]\nBUZZ:   \($t.buzz)\nANGLE:  \($t.angle // "")\nSOURCE: [\($i.kind)] \($i.source) | \($i.title)\nTEXT:   \(($i.body // "")[0:500])\nLINK:   \($t.source_url)\(if $t.image_url then "\nIMAGE:  \($t.image_license) · from \($t.image_origin) → preview/images/\($t.image_url | split("/") | last)" else "\nIMAGE:  none" end)"' preview/radar.preview.json || cat preview/radar.preview.json || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dry-run-results
          path: preview/
