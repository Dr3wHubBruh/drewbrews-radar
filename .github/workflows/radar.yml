name: Weekly Trend Radar

on:
  # Wednesday 13:00 UTC = 5am PST / 6am PDT.
  # GitHub cron is UTC and does NOT observe DST, so this drifts ±1h seasonally —
  # harmless for weekly content. (Exact 5am year-round would need two cron lines.)
  schedule:
    - cron: "0 13 * * 3"
  # Manual "Run now" button in the Actions tab.
  workflow_dispatch:

# Allow the job to commit the refreshed radar.json back to the repo.
permissions:
  contents: write

# Never run two scouts at once.
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: with these set, Reddit is read via the official API
          # (scores + comment counts); without them it falls back to RSS.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Optional: YouTube Data API key (reliable); without it, public feeds (flaky).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scout.mjs

      - name: Commit radar.json and images/ if they changed
        run: |
          git config user.name "drewbrews-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          # clear any half-finished rebase/merge left by a previous failed run
          git rebase --abort 2>/dev/null || true
          git merge  --abort 2>/dev/null || true

          # keep the freshly generated radar + its images safe
          cp radar.json /tmp/radar.json
          rm -rf /tmp/radar-images && mkdir -p /tmp/radar-images
          if [ -d images ]; then cp -a images/. /tmp/radar-images/; fi

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main      # match remote exactly — no conflict possible
            cp /tmp/radar.json radar.json     # re-apply our fresh file on top
            rm -rf images                     # images/ = exactly what this run referenced
            if [ -n "$(ls -A /tmp/radar-images)" ]; then mkdir -p images && cp -a /tmp/radar-images/. images/; fi

            if [ -z "$(git status --porcelain -- radar.json images)" ]; then
              echo "No change this week — nothing to post."
              exit 0
            fi

            git add -A -- radar.json
            git add -A -- images 2>/dev/null || true   # also records deletions of pruned images
            git commit -m "radar: weekly refresh ($(date +%F))"

            if git push origin main; then
              echo "Pushed radar.json."
              exit 0
            fi

            echo "Push attempt $i failed (remote advanced). Retrying in 5s…"
            sleep 5
          done

          echo "::error::Failed to push radar.json after 5 attempts."
          exit 1

      - name: Publish radar.json to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"files\":{\"radar.json\":{\"content\":$(cat radar.json | jq -Rs .)}}}" \
            "https://api.github.com/gists/$GIST_ID" \
          | grep -qE '^2' && echo "Gist updated." || echo "::warning::Gist update failed (non-2xx response)."
